<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#logo-gradient)"/>
  
  <!-- Key and Customization Visual Group -->
  <g transform="translate(10, 0)">
    <!-- Dial / Equalizer notches around the bow representing custom calibration -->
    <path d="M 134 210 A 65 65 0 0 1 226 210" fill="none" stroke="#111111" stroke-width="4" stroke-dasharray="8,6" opacity="0.6"/>
    
    <!-- Outer Bow Circle (Standard Key Loop + Tuner Ring) -->
    <circle cx="180" cy="256" r="65" stroke="#111111" stroke-width="18" fill="none" />
    
    <!-- Concentric Inner Circle -->
    <circle cx="180" cy="256" r="42" stroke="#111111" stroke-width="4" stroke-dasharray="4,4" fill="none" opacity="0.4" />
    
    <!-- Customization Slider Track inside Key Bow -->
    <line x1="145" y1="256" x2="215" y2="256" stroke="#111111" stroke-width="10" stroke-linecap="round" />
    
    <!-- Slider Knob (Representing Custom Adjustments) -->
    <circle cx="195" cy="256" r="15" fill="#111111" />
    <!-- Slider Knob Core Highlight -->
    <circle cx="195" cy="256" r="5" fill="#fde68a" />

    <!-- Anchor/alignment ticks on the dial -->
    <line x1="180" y1="168" x2="180" y2="178" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <line x1="180" y1="334" x2="180" y2="344" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <line x1="115" y1="256" x2="125" y2="256" stroke="#111111" stroke-width="8" stroke-linecap="round" />

    <!-- Key Shaft -->
    <line x1="240" y1="256" x2="400" y2="256" stroke="#111111" stroke-width="18" stroke-linecap="round" />
    
    <!-- Key Teeth designed as a step-wise growth chart / customized puzzle cuts -->
    <rect x="295" y="256" width="18" height="35" rx="6" fill="#111111" />
    <rect x="330" y="256" width="18" height="55" rx="6" fill="#111111" />
    <rect x="365" y="256" width="18" height="25" rx="6" fill="#111111" />
    
    <!-- Small spark/pinhole of light at the tip of the shaft for premium luster -->
    <circle cx="339" cy="256" r="3" fill="#fde68a" />
    <circle cx="388" cy="256" r="3.5" fill="#fde68a" />
  </g>
</svg>
